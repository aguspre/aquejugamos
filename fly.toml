# fly.toml app configuration file generated for aquejugamos on 2026-11-25T14:43:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'aquejugamos'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
